  <header class="site-header">

    <section class="work-detail">
      <img src="images/work2.jpg" alt="繁花专题地图大图">
      <div class="meta">
        <span class="tag">专题制图</span>
        <h1>繁花专题地图</h1>
        <p class="desc">
          以上海为背景的《繁花》文化地标复古专题地图。地图采用暖黄米褐的做旧
          色调，四周围绕玉兰花枝装饰，标注了静安寺、国泰电影院、至真园饭店、
          东方明珠等与小说及剧集相关的地标建筑，并通过不同的手绘风格图标区分
          建筑类别，是一幅将文学作品空间化的文化地理作品。
        </p>
        <a href="works.html" class="btn-back">← 返回作品列表</a>
      </div>
    </section>
