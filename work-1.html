  <header class="site-header">
    <div class="logo">Exist · GIS 学习中</div>

        <span class="tag">Web GIS</span>
        <h1>繁花系统首页</h1>
        <p class="desc">
          “寻迹繁花”文化遗产数字化平台的可视化大屏首页。页面集成三维城市地图、
          历史建筑空间分布统计与实时客流监控等数据模块，是典型的 Web GIS 数据
          大屏应用。左侧提供文化遗产总量、覆盖区域等关键指标卡片，中部为带标签的
          三维地图，右侧展示天气与城市记忆等辅助信息。
